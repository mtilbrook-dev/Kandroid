org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official
# Published artifacts must not drag a kotlin-stdlib version into consumers: the annotations are
# compile-only for apps, and Gradle supplies its own stdlib to plugins. Each module adds it as
# compileOnly (tests add it explicitly).
kotlin.stdlib.default.dependency=false
