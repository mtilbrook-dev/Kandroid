[versions]
kandroid = "0.1.0"
kotlin = "2.4.10"
gradle-android = "9.4.1"
# Bytecode level for published artifacts. Gradle 9 itself requires Java 17+.
jvmTarget = "17"
# Android SDK levels used by the integration-test fixture projects.
android-compileSdk = "37"
android-minSdk = "24"
junit = "5.13.4"

[libraries]
android-gradle-api = { module = "com.android.tools.build:gradle-api", version.ref = "gradle-android" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
publish = { id = "com.gradle.plugin-publish", version = "2.2.1" }
