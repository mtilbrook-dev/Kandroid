[versions]
kandroid = "0.1.0"
kotlin = "2.4.10"
# Oldest Kotlin our published artifacts target: language/API 2.2, compiled against this stdlib (compileOnly).
kotlinConsumerStdlib = "2.2.20"
gradle-android = "9.4.1"
# Bytecode level for published artifacts. Gradle 9 itself requires Java 17+.
jvmTarget = "17"
# Android SDK levels used by the integration-test fixture projects.
android-compileSdk = "37"
android-minSdk = "24"
junit = "5.13.4"
junit4 = "4.13.2"
# Lint version = AGP version + 23.0.0
lint = "32.4.1"

[libraries]
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlinConsumerStdlib" }
android-gradle-api = { module = "com.android.tools.build:gradle-api", version.ref = "gradle-android" }
lint-api = { module = "com.android.tools.lint:lint-api", version.ref = "lint" }
lint-core = { module = "com.android.tools.lint:lint", version.ref = "lint" }
lint-tests = { module = "com.android.tools.lint:lint-tests", version.ref = "lint" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
publish = { id = "com.gradle.plugin-publish", version = "2.2.1" }
